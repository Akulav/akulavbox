<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AkulavBox</title>
  <meta name="description" content="Your AkulavBox apps: Trove, e-Management, Florin, Tick and Ironveil. Made by Akulav.">
  <meta name="application-name" content="AkulavBox">
  <meta name="referrer" content="same-origin">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0D1518">
  <script>
    // links from before 4.0 (/#/files/…) belong to Trove, which lives at /box/
    if (/^#\//.test(location.hash)) location.replace('/box/' + location.hash);
    // If the page's script can't start (an error, or a phone with an old copy of it cached) or the
    // server doesn't answer, say so with a way out instead of "Loading your apps…" for ever.
    (function () {
      var stuck = function (why) {
        var b = document.getElementById('boot');
        if (!b || b.hidden || b.getAttribute('data-stuck')) return;
        b.setAttribute('data-stuck', '1');
        b.innerHTML = '<div style="text-align:center;max-width:420px;padding:0 16px"><p style="margin:0 0 6px;font-weight:600">Your apps didn’t load.</p><p style="margin:0 0 14px;font-size:13px">' + why + '</p><button class="btn btn-primary" onclick="location.reload()">Reload</button> <a class="btn" href="/login?out=1">Sign in again</a></div>';
      };
      window.addEventListener('error', function (e) { stuck('Something on this page failed to start' + (e && e.message ? ': ' + String(e.message).replace(/[<>&]/g, '') : '') + '. Reloading usually fixes it.'); });
      window.addEventListener('unhandledrejection', function () { stuck('A request failed. Check your connection, then reload.'); });
      setTimeout(function () { stuck('The server is taking too long to answer. Check your connection, then reload.'); }, 15000);
    })();
  </script>
  <script src="/hub/theme.js"></script>
  <script src="/hub/account.js" defer></script>
  <link rel="preload" href="/hub/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/hub/fonts/fonts.css">
  <link rel="stylesheet" href="/hub/hub.css">
  <link rel="modulepreload" href="/hub/common.js">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/" id="lockup" aria-label="AkulavBox, all apps"></a>
      <span class="spacer"></span>
      <div id="account" style="display:flex;align-items:center;gap:4px"></div>
    </div>
  </header>
  <!-- everything on one screen, no scrolling: the apps in a row, then storage beside the account links -->
  <main class="wrap home">
    <div id="boot" class="boot">Loading your apps…</div>
    <div id="page" class="home-page" hidden>
      <section class="hello rise">
        <p class="muted" id="when"></p>
        <h1 id="greet"></h1>
      </section>
      <p class="alert weak" id="weak" role="status" hidden></p>
      <section class="apps-grid stagger" id="apps" aria-label="Your apps"></section>
      <div class="lower">
        <section class="panel space-card rise" id="space" aria-label="Storage" hidden></section>
        <nav class="links-grid rise" aria-label="Your account">
          <a class="panel link-card" href="/box/#/profile" style="--c:rgb(var(--accent))">
            <span class="tile" id="profile-icon"></span>
            <span class="txt"><h2>Profile &amp; password</h2><span class="muted">Your picture, password and devices</span></span>
            <span class="go" data-go></span>
          </a>
          <a class="panel link-card" href="/connect" style="--c:#8b5cf6">
            <span class="tile" id="connect-icon"></span>
            <span class="txt"><h2>AI connectors</h2><span class="muted">Let Claude or another AI use your apps</span></span>
            <span class="go" data-go></span>
          </a>
          <a class="panel link-card" href="/admin" id="admin" hidden style="--c:rgb(var(--info))">
            <span class="tile" id="admin-icon"></span>
            <span class="txt"><h2>Admin console</h2><span class="muted">Accounts, apps and storage</span></span>
            <span class="go" data-go></span>
          </a>
        </nav>
      </div>
    </div>
    <footer class="footer" id="footer"></footer>
  </main>
  <script type="module" src="/hub/home.js"></script>
</body>
</html>
