<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Florin</title>
    <meta name="description" content="Florin is a self-hosted budgeting app: track expenses in any currency, set budgets and see where your money goes." />
    <meta name="theme-color" content="#0b8a67" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1412" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/budget/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/budget/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/budget/apple-touch-icon.png" />
    <link rel="manifest" href="/budget/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- the theme every app shares, before first paint; the shared account menu -->
    <script src="/hub/theme.js"></script>
    <script src="/hub/account.js" defer></script>

    <script type="importmap">
      { "imports": { "vue": "/hub/vendor/vue.js" } }
    </script>
    <link rel="modulepreload" href="/hub/vendor/vue.js" />
    <link rel="modulepreload" href="/budget/app.js" />
    <link rel="modulepreload" href="/budget/js/api.js" />
    <link rel="modulepreload" href="/budget/js/format.js" />
    <link rel="modulepreload" href="/budget/js/store.js" />
    <link rel="modulepreload" href="/budget/js/router.js" />
    <link rel="modulepreload" href="/budget/js/icon-paths.js" />
    <link rel="modulepreload" href="/budget/js/icons.js" />
    <link rel="modulepreload" href="/hub/vue/ui.js" />
    <link rel="modulepreload" href="/hub/vue/icon.js" />
    <link rel="modulepreload" href="/hub/vue/router.js" />
    <link rel="modulepreload" href="/budget/js/charts.js" />
    <link rel="modulepreload" href="/budget/js/layout.js" />
    <link rel="modulepreload" href="/budget/js/tx-modal.js" />
    <link rel="modulepreload" href="/budget/js/pages/dashboard.js" />
    <link rel="modulepreload" href="/budget/js/pages/transactions.js" />
    <link rel="modulepreload" href="/budget/js/pages/analytics.js" />
    <link rel="modulepreload" href="/budget/js/pages/categories.js" />
    <link rel="modulepreload" href="/budget/js/pages/settings.js" />
    <link rel="modulepreload" href="/budget/js/pages/admin.js" />

    <!-- Tailwind compiles the classes in the browser (served by this server, no build step) -->
    <script src="/hub/vendor/tailwind.js"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
      @theme inline {
        --color-bg: var(--bg);
        --color-surface: var(--surface);
        --color-surface-2: var(--surface-2);
        --color-line: var(--border);
        --color-ink: var(--text);
        --color-ink-2: var(--text-2);
        --color-ink-3: var(--text-3);
        --color-brand: var(--brand);
        --color-brand-strong: var(--brand-strong);
        --color-brand-soft: var(--brand-soft);
        --color-gold: var(--gold);
        --color-danger: var(--danger);
        --color-warning: var(--warning);
        --font-sans: Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-display: 'Bricolage Grotesque', Geist, ui-sans-serif, system-ui, sans-serif;
      }
    </style>
    <link rel="stylesheet" href="/hub/vue/base.css" />
    <link rel="stylesheet" href="/budget/style.css" />
  </head>
  <body>
    <div id="app" v-cloak></div>
    <noscript><p style="padding:24px;font-family:sans-serif">Florin needs JavaScript turned on.</p></noscript>
    <script type="module" src="/budget/app.js"></script>
  </body>
</html>
