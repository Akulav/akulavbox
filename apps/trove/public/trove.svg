<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Trove mark (files, photos, music, videos and books): a brass tile with stacked layers -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7C766"/>
      <stop offset=".55" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#C9711F"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#hi)" opacity=".55"/>
  <g fill="none" stroke="#21170A" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M32 14 50 22.5 32 31 14 22.5Z" fill="#FFF3D6" fill-opacity=".6"/>
    <path d="M14 31.5 32 40 50 31.5"/>
    <path d="M14 40.5 32 49 50 40.5"/>
  </g>
</svg>
